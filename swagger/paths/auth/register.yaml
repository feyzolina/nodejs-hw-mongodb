tags:
  - Authentication
summary: Register a new user
operationId: registerUser
description: |
  Register a new user account with name, email, and password.
  The email must be unique across the system.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: User's full name
            example: "John Doe"
          email:
            type: string
            format: email
            description: User's email address (must be unique)
            example: "john.doe@example.com"
          password:
            type: string
            minLength: 6
            description: User's password
            example: "password123"
      examples:
        registration_request:
          summary: User registration request
          value:
            name: "John Doe"
            email: "john.doe@example.com"
            password: "password123"
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Successfully registered a user!"
            data:
              $ref: '../../components/schemas/User.yaml#/User'
  '409':
    description: Email already in use
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml#/Error'
        examples:
          email_in_use:
            summary: Email already registered
            value:
              status: 409
              message: "Email in use"
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml#/Error'