tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: |
  Delete a specific contact by its unique identifier.
  The contact must belong to the authenticated user.
  This action is irreversible.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    description: MongoDB ObjectId of the contact
    example: "507f1f77bcf86cd799439011"
responses:
  '204':
    description: Contact deleted successfully (no content returned)
  '401':
    description: Authentication required
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml#/Error'
        examples:
          no_token:
            summary: No authentication token provided
            value:
              status: 401
              message: "Authorization header is required"
          invalid_token:
            summary: Invalid or expired token
            value:
              status: 401
              message: "Access token expired"
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml#/Error'
        examples:
          not_found:
            summary: Contact does not exist or doesn't belong to user
            value:
              status: 404
              message: "Contact not found"
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml#/Error'
        examples:
          server_error:
            summary: Server error occurred
            value:
              status: 500
              message: "Internal server error"