tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: |
  Retrieve a specific contact by its unique identifier. 
  The contact must belong to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    description: MongoDB ObjectId of the contact
    example: "507f1f77bcf86cd799439011"
responses:
  '200':
    description: Contact retrieved successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contact with id 507f1f77bcf86cd799439011!"
            data:
              $ref: '../../../components/schemas/Contact.yaml#/Contact'
        examples:
          successful_response:
            summary: Successful contact retrieval
            value:
              status: 200
              message: "Successfully found contact with id 507f1f77bcf86cd799439011!"
              data:
                _id: "507f1f77bcf86cd799439011"
                name: "John Doe"
                phoneNumber: "+1234567890"
                email: "john.doe@example.com"
                isFavourite: false
                contactType: "personal"
                photo: "https://res.cloudinary.com/example/image/upload/v1234567890/photos/contact.jpg"
                userId: "507f1f77bcf86cd799439012"
                createdAt: "2023-10-24T10:30:00.000Z"
                updatedAt: "2023-10-24T15:45:00.000Z"
  '401':
    description: Authentication required
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml#/Error'
        examples:
          no_token:
            summary: No authentication token provided
            value:
              status: 401
              message: "Authorization header is required"
          invalid_token:
            summary: Invalid or expired token
            value:
              status: 401
              message: "Access token expired"
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml#/Error'
        examples:
          not_found:
            summary: Contact does not exist or doesn't belong to user
            value:
              status: 404
              message: "Contact not found"
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Error.yaml#/Error'
        examples:
          server_error:
            summary: Server error occurred
            value:
              status: 500
              message: "Internal server error"