tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: |
  Retrieve all contacts belonging to the authenticated user with support for
  pagination, sorting, and filtering.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination
    example: 1
  - name: perPage
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: Number of contacts per page
    example: 10
  - name: sortBy
    in: query
    schema:
      type: string
      enum: [_id, name, phoneNumber, email, contactType, isFavourite, createdAt, updatedAt]
      default: _id
    description: Field to sort by
    example: name
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order (ascending or descending)
    example: asc
  - name: type
    in: query
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by type
    example: personal
  - name: isFavourite
    in: query
    schema:
      type: boolean
    description: Filter contacts by favourite status
    example: true
responses:
  '200':
    description: Contacts retrieved successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contacts!"
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/Contact.yaml#/Contact'
                page:
                  type: integer
                  description: Current page number
                  example: 1
                perPage:
                  type: integer
                  description: Number of items per page
                  example: 10
                totalItems:
                  type: integer
                  description: Total number of contacts
                  example: 25
                totalPages:
                  type: integer
                  description: Total number of pages
                  example: 3
                hasPreviousPage:
                  type: boolean
                  description: Whether there is a previous page
                  example: false
                hasNextPage:
                  type: boolean
                  description: Whether there is a next page
                  example: true
        examples:
          successful_response:
            summary: Successful contacts retrieval with pagination
            value:
              status: 200
              message: "Successfully found contacts!"
              data:
                data:
                  - _id: "507f1f77bcf86cd799439011"
                    name: "John Doe"
                    phoneNumber: "+1234567890"
                    email: "john.doe@example.com"
                    isFavourite: false
                    contactType: "personal"
                    userId: "507f1f77bcf86cd799439012"
                    createdAt: "2023-10-24T10:30:00.000Z"
                    updatedAt: "2023-10-24T15:45:00.000Z"
                  - _id: "507f1f77bcf86cd799439013"
                    name: "Jane Smith"
                    phoneNumber: "+0987654321"
                    email: "jane.smith@example.com"
                    isFavourite: true
                    contactType: "work"
                    userId: "507f1f77bcf86cd799439012"
                    createdAt: "2023-10-23T14:20:00.000Z"
                    updatedAt: "2023-10-24T09:15:00.000Z"
                page: 1
                perPage: 10
                totalItems: 25
                totalPages: 3
                hasPreviousPage: false
                hasNextPage: true
  '401':
    description: Authentication required
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml#/Error'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml#/Error'