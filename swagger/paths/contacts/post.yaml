tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: |
  Create a new contact for the authenticated user. 
  Supports image upload via multipart/form-data.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact's full name
            example: "John Doe"
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact's phone number
            example: "+1234567890"
          email:
            type: string
            format: email
            description: Contact's email address
            example: "john.doe@example.com"
          isFavourite:
            type: boolean
            default: false
            description: Whether the contact is marked as favourite
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: "personal"
          photo:
            type: string
            format: binary
            description: Contact's photo file (JPEG, PNG, etc.)
      examples:
        with_photo:
          summary: Create contact with photo
          value:
            name: "John Doe"
            phoneNumber: "+1234567890"
            email: "john.doe@example.com"
            contactType: "personal"
            isFavourite: false
            photo: "(binary file data)"
        without_photo:
          summary: Create contact without photo
          value:
            name: "Jane Smith"
            phoneNumber: "+0987654321"
            email: "jane.smith@company.com"
            contactType: "work"
            isFavourite: true
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Successfully created a contact!"
            data:
              $ref: '../../components/schemas/Contact.yaml#/Contact'
        examples:
          successful_creation:
            summary: Contact created with photo
            value:
              status: 201
              message: "Successfully created a contact!"
              data:
                _id: "507f1f77bcf86cd799439014"
                name: "John Doe"
                phoneNumber: "+1234567890"
                email: "john.doe@example.com"
                isFavourite: false
                contactType: "personal"
                photo: "https://res.cloudinary.com/example/image/upload/v1234567890/photos/new-contact.jpg"
                userId: "507f1f77bcf86cd799439012"
                createdAt: "2023-10-24T16:30:00.000Z"
                updatedAt: "2023-10-24T16:30:00.000Z"
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml#/Error'
        examples:
          validation_error:
            summary: Missing required fields
            value:
              status: 400
              message: "\"name\" is required"
          invalid_contact_type:
            summary: Invalid contact type
            value:
              status: 400
              message: "\"contactType\" must be one of [work, home, personal]"
  '401':
    description: Authentication required
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml#/Error'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Error.yaml#/Error'